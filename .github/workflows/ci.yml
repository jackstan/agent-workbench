name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run policy and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate example project
        run: agent-workbench check-config examples/demo/project.toml
      - name: Run offline demonstration
        run: agent-workbench demo
      - name: Build and verify wheel outside checkout
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/agent_workbench-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/agent-workbench" demo
          "$RUNNER_TEMP/wheel-check/bin/agent-workbench" ledger-init "$RUNNER_TEMP/wheel-ledger.sqlite"
