# Copy to .github/workflows/workbench.yml in the consuming repository.
# Pin WORKBENCH_REVISION to a reviewed full commit before enabling.
name: Agent Workbench
run-name: "Workbench · PR #${{ inputs.pr }} · verifier → repair → verifier"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number (agent/* branch)
        required: true
        type: string
      head:
        description: Exact 40-character candidate commit approved for this run
        required: true
        type: string

permissions: {}

concurrency:
  group: workbench-pr-${{ inputs.pr }}
  cancel-in-progress: false

env:
  WORKBENCH_REVISION: REPLACE_WITH_REVIEWED_COMMIT
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'

jobs:
  approve:
    name: Validate approval and reserve run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      base: ${{ steps.reserve.outputs.base }}
    steps:
      - name: Require model connection before reserving work
        env:
          HAS_MODEL_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_MODEL_KEY" != "true" ]; then
            echo "::error::Add the dedicated OPENAI_API_KEY Actions secret. No approval has been consumed."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jackstan/agent-workbench
          ref: ${{ env.WORKBENCH_REVISION }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./engine
      - name: Bind owner approval to proposal, scope, base and candidate
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          CANDIDATE_HEAD: ${{ inputs.head }}
        run: |
          python -m agent_workbench.github_cycle prepare \
            --project project/project.github.toml --proposal project/proposal.github.json \
            --checkout project --pr "$PR_NUMBER" --head "$CANDIDATE_HEAD" \
            --output "$RUNNER_TEMP/authorization.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authorization-${{ github.run_id }}
          path: ${{ runner.temp }}/authorization.json
          if-no-files-found: error
          retention-days: 90

  cycle:
    name: Independent verifier → builder repair → fresh verifier
    needs: approve
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jackstan/agent-workbench
          ref: ${{ env.WORKBENCH_REVISION }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authorization-${{ github.run_id }}
          path: ${{ runner.temp }}/approval
      - name: Install pinned Codex and protected inference proxy; remove sudo
        uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.162.0-alpha.17.2
          safety-strategy: drop-sudo
          # No prompt: the coordinator launches independent Codex processes below.
      - name: Run coordinator (live WORKBENCH stage events)
        env:
          GH_TOKEN: ${{ github.token }} # Read-only; excluded from worker environment.
        run: |
          modules_dir="$(npm root -g)"
          codex_native="$(python -c 'import pathlib,sys; p=list(pathlib.Path(sys.argv[1]).glob("**/vendor/*/bin/codex")); assert len(p)==1, p; print(p[0])' "$modules_dir")"
          python -m agent_workbench.github_cycle run \
            --packet "$RUNNER_TEMP/approval/authorization.json" \
            --checkout "$GITHUB_WORKSPACE/candidate" \
            --workspace "$RUNNER_TEMP/workbench-workers" \
            --evidence "$RUNNER_TEMP/workbench-evidence" \
            --codex "$codex_native"
      - name: Retain prompts, process logs, stage events and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cycle-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/workbench-evidence/
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Validate evidence and publish for human merge
    needs: [approve, cycle]
    if: ${{ always() && needs.approve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.approve.outputs.base }}
          fetch-depth: 0
          path: project
          persist-credentials: true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jackstan/agent-workbench
          ref: ${{ env.WORKBENCH_REVISION }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: authorization-${{ github.run_id }}
          path: ${{ runner.temp }}/approval
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.cycle.result == 'success' }}
        with:
          name: cycle-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
      - name: Check exact tree and current authority; publish without merging
        if: ${{ needs.cycle.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m agent_workbench.github_cycle publish \
            --packet "$RUNNER_TEMP/approval/authorization.json" \
            --checkout "$GITHUB_WORKSPACE/project" --evidence "$RUNNER_TEMP/evidence"
      - name: Mark unsuccessful run for inspection
        if: ${{ always() && (needs.cycle.result != 'success' || failure()) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m agent_workbench.github_cycle report-failure \
            --packet "$RUNNER_TEMP/approval/authorization.json"
